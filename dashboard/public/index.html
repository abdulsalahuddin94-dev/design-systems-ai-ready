<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workflow Dashboard</title>
<meta name="description" content="Local dashboard for the Design systems Ai Ready workflow.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Red+Hat+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>

    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></symbol>

    <symbol id="logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="currentColor"/><path d="M16 1v8M16 23v8M1 16h8M23 16h8" stroke="currentColor" stroke-width="2"/></symbol>

<header class="masthead">
  <div class="strip" aria-hidden="true"><i class="c"></i><i class="m"></i><i class="y"></i><i class="k"></i><i class="c t75"></i><i class="m t75"></i><i class="y t75"></i><i class="k t75"></i><i class="c t50"></i><i class="m t50"></i><i class="y t50"></i><i class="k t50"></i><i class="c t25"></i><i class="m t25"></i><i class="y t25"></i><i class="k t25"></i></div>
  <nav class="topnav" aria-label="Dashboard">
    <a class="brand" href="#/" aria-label="AI-Ready Design Systems, Home">
      <span class="mark" aria-hidden="true"><svg class="reg c"><use href="#logo"/></svg><svg class="reg m"><use href="#logo"/></svg><svg class="reg k"><use href="#logo"/></svg></span>
      <span class="word"><b>AI-Ready</b> Design Systems</span>
    </a>
    <div class="navlinks">
      <a href="#/" data-nav="home"><svg class="ic"><use href="#i-pen"/></svg>Jobs</a>
      <a href="docs/getting-started.html" target="_blank" rel="noopener"><svg class="ic"><use href="#i-docs"/></svg>Docs</a>
    </div>
    <div class="status">
      <button class="pill perm" type="button" id="perm" hidden title="How often Claude asks before a step"></button>
      <button class="pill account" type="button" id="account" hidden></button>
      <button class="iconbtn theme" type="button" id="theme" aria-label="Switch light or dark"><svg class="ic sun"><use href="#i-sun"/></svg><svg class="ic moon"><use href="#i-moon"/></svg></button>
    </div>
  </nav>
</header>

<div id="update" class="update" hidden></div>
<div id="app"></div>

<template id="tpl-home">
  <main class="home">
    <section class="intro" aria-labelledby="hello">
      <div class="intro-text">
        <h1 id="hello">What are we <em>building</em> today?</h1>
        <p class="lead">Every button starts the same Claude Code you use in the terminal, with the same skills and rules. Menus come back as buttons and screenshots come back as proofs for you to sign off.</p>
      </div>
      <dl class="tally" id="tally" aria-label="Today">
        <div><dt>Jobs</dt><dd id="t-jobs">–</dd></div>
        <div class="warn"><dt>Storybook waiting</dt><dd id="t-sync">–</dd></div>
        <div class="live"><dt>Running now</dt><dd id="t-live">–</dd></div>
      </dl>
    </section>

    <section class="start" aria-labelledby="start">
      <h2 id="start" class="section-title">Start</h2>
      <div class="start-grid">
        <button class="tile lead-tile reg-hover" data-start="new" aria-label="Start a new project (recommended)">
          <span class="tile-ic"><svg class="ic"><use href="#i-plus"/></svg></span>
          <span class="tile-body">
            <span class="tile-title">Start a new project</span>
            <span class="tile-desc">The intake asks one question at a time, then creates the project folder and its Figma plan.</span>
          </span>
          <svg class="ic go"><use href="#i-right"/></svg>
        </button>
        <button class="tile reg-hover" data-start="join">
          <span class="tile-ic"><svg class="ic"><use href="#i-users"/></svg></span>
          <span class="tile-body"><span class="tile-title">Join a team project</span><span class="tile-desc">Paste its GitHub link; it lands in My Projects.</span></span>
        </button>
        <button class="tile reg-hover" data-start="quick">
          <span class="tile-ic"><svg class="ic"><use href="#i-zap"/></svg></span>
          <span class="tile-body"><span class="tile-title">One task on a live file</span><span class="tile-desc">One component, an audit or one fix, no intake.</span></span>
        </button>
        <button class="tile reg-hover" data-start="chat">
          <span class="tile-ic"><svg class="ic"><use href="#i-message"/></svg></span>
          <span class="tile-body"><span class="tile-title">Ask Claude</span><span class="tile-desc">Any request, like in the terminal.</span></span>
        </button>
        <button class="tile reg-hover" data-start="phone">
          <span class="tile-ic"><svg class="ic"><use href="#i-phone"/></svg></span>
          <span class="tile-body"><span class="tile-title">Work from my phone</span><span class="tile-desc">Remote Control: follow and answer in the Claude app.</span></span>
        </button>
      </div>
    </section>

    <section class="jobs" aria-labelledby="projects">
      <div class="row-head">
        <h2 id="projects" class="section-title">My projects</h2>
        <button class="textbtn" type="button" id="refresh"><svg class="ic"><use href="#i-refresh"/></svg>Refresh</button>
      </div>
      <div id="project-list" class="tickets"><p class="muted">Loading…</p></div>
    </section>

    <div class="lower">
      <section class="board-wrap" aria-labelledby="recent" id="recent-wrap" hidden>
        <h2 id="recent" class="section-title">Recent conversations</h2>
        <ul id="recent-list" class="board"></ul>
      </section>

      <section class="addon" aria-labelledby="add">
        <h2 id="add" class="section-title">Add to the workflow</h2>
        <p class="muted small">Each one is checked, then sent as a pull request for review.</p>
        <div class="add-list">
          <button class="add-row" data-add="reference"><svg class="ic"><use href="#i-library"/></svg><span><b>Reference design system</b><small>Study another company's Figma design system so new projects can start from it.</small></span><svg class="ic go"><use href="#i-plus"/></svg></button>
          <button class="add-row" data-add="icons"><svg class="ic"><use href="#i-shapes"/></svg><span><b>Icon library</b><small>A free icon set the intake can offer for new projects.</small></span><svg class="ic go"><use href="#i-plus"/></svg></button>
          <button class="add-row" data-add="skill"><svg class="ic"><use href="#i-blocks"/></svg><span><b>Skill from GitHub</b><small>Claude checks what it adds before changing anything.</small></span><svg class="ic go"><use href="#i-plus"/></svg></button>
        </div>
      </section>
    </div>
  </main>
</template>

<template id="tpl-chat">
  <div class="chat-layout">
    <aside class="side" aria-label="Project">
      <a class="back" href="#/"><svg class="ic"><use href="#i-left"/></svg>All jobs</a>
      <div class="side-head sheet">
        <div class="side-kicker" id="side-kicker">Conversation</div>
        <h2 id="side-title"></h2>
        <p class="note" id="side-meta"></p>
        <div id="side-track"></div>
      </div>
      <div id="side-links" class="side-links"></div>
      <div id="side-actions" class="side-actions"></div>
      <div class="side-foot">
        <button class="ghost" type="button" id="to-phone" title="Move this conversation to a terminal with Remote Control"><svg class="ic"><use href="#i-phone"/></svg>Continue on my phone</button>
        <button class="ghost" type="button" id="to-terminal" title="Continue this conversation in a terminal"><svg class="ic"><use href="#i-terminal"/></svg>Open in Claude Code</button>
      </div>
    </aside>
    <section class="chat" aria-label="Conversation">
      <div id="log" class="log" aria-live="polite"></div>
      <form id="composer" class="composer" autocomplete="off">
        <div id="attachments" class="attachments"></div>
        <div class="composer-row">
          <label class="attach" title="Attach an image">
            <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
            <svg class="ic" aria-hidden="true"><use href="#i-clip"/></svg><span class="sr">Attach an image</span>
          </label>
          <textarea id="input" rows="1" placeholder="Write to Claude (Arabic or English). Paste or drop screenshots here." dir="auto"></textarea>
          <button type="button" id="stop" class="ghost" hidden><svg class="ic"><use href="#i-stop"/></svg>Stop</button>
          <button type="submit" id="send" class="primary"><svg class="ic"><use href="#i-send"/></svg><span>Send</span></button>
        </div>
        <p class="note" id="status-line"></p>
      </form>
    </section>
  </div>
</template>

<template id="tpl-dialog">
  <dialog class="ask" id="ask">
    <form method="dialog" class="ask-form">
      <h3 id="ask-title"></h3>
      <p class="muted" id="ask-help"></p>
      <textarea id="ask-input" rows="3" dir="auto"></textarea>
      <div class="ask-buttons">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="primary" id="ask-ok">Start</button>
      </div>
    </form>
  </dialog>
</template>

<template id="tpl-signin">
  <dialog class="ask signin" id="signin">
    <div class="ask-form">
      <h3>Sign in to Claude</h3>
      <p class="muted" id="signin-help">Uses the same account as Claude Code in the terminal. Your browser opens the Claude sign-in page; finish there and come back.</p>
      <div id="signin-body"></div>
      <div class="ask-buttons">
        <button type="button" class="ghost" id="signin-close">Close</button>
        <button type="button" class="primary" id="signin-start">Sign in</button>
      </div>
    </div>
  </dialog>
</template>

<template id="tpl-add">
  <dialog class="ask add" id="adddlg">
    <form method="dialog" class="ask-form" id="add-form">
      <h3 id="add-title"></h3>
      <div class="add-cols">
        <div><p class="col-title">What you need</p><ol id="add-need"></ol></div>
        <div><p class="col-title">What happens when you press Add</p><ol id="add-steps"></ol></div>
      </div>
      <div id="add-fields" class="add-fields"></div>
      <p class="note" id="add-note"></p>
      <div class="ask-buttons">
        <button value="cancel" class="ghost" formnovalidate>Cancel</button>
        <button value="ok" class="primary">Add</button>
      </div>
    </form>
  </dialog>
</template>

<template id="tpl-perm">
  <dialog class="ask" id="permdlg">
    <form method="dialog" class="ask-form">
      <h3>How often should Claude ask?</h3>
      <label class="opt"><input type="radio" name="mode" value="auto"><span><b>Auto (Recommended)</b><small>Claude approves routine steps by itself (reading, editing workflow files, Figma scripts, audits) and asks only before risky ones, like deleting files, pushing to GitHub or installing something. The same Auto mode as Claude Code.</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="default"><span><b>Ask every time</b><small>A Yes / No card before every step that needs permission.</small></span></label>
      <p class="note">Design questions and checkpoint approvals still come to you either way: they are your decisions, not permissions. To answer them away from this computer, use "Continue on my phone".</p>
      <div class="ask-buttons">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="primary">Save</button>
      </div>
    </form>
  </dialog>
</template>

<script src="app.js"></script>
</body>
</html>
