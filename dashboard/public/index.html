<template id="tpl-home">
  <main class="home">
    <section class="intro" aria-labelledby="hello">
      <div class="intro-text">
        <h1 id="hello">What are we <em>building</em> today?</h1>
        <p class="lead">Every button starts the same Claude Code you use in the terminal, with the same skills and rules, working on your Figma files. Menus come back as buttons and screenshots come back as proofs for you to sign off.</p>
      </div>
      <dl class="tally" id="tally" aria-label="Today">
        <div><dt><a href="#/projects">Projects</a></dt><dd id="t-jobs">–</dd></div>
        <div class="warn"><dt>Storybook waiting</dt><dd id="t-sync">–</dd></div>
        <div class="live"><dt>Running now</dt><dd id="t-live">–</dd></div>
        <div class="figma"><dt><svg class="logo-ic" viewBox="0 0 256 384" aria-hidden="true"><use href="#b-figma-color"/></svg>Figma</dt><dd id="t-figma" class="word-val">–</dd></div>
      </dl>
    </section>

    <section class="start" aria-labelledby="start">
      <h2 id="start" class="section-title">Start</h2>
      <div class="start-grid">
        <button class="tile lead-tile reg-hover" data-start="new" aria-label="Start a new project (recommended)">
          <span class="tile-ic"><svg class="ic"><use href="#i-plus"/></svg></span>
          <span class="tile-body">
            <span class="tile-title">Start a new project</span>
            <span class="tile-desc">The intake asks one question at a time, then creates the project folder and its Figma plan.</span>
          </span>
          <svg class="ic go"><use href="#i-right"/></svg>
        </button>
        <button class="tile reg-hover" data-start="join">
          <span class="tile-ic"><svg class="ic"><use href="#i-users"/></svg></span>
          <span class="tile-body"><span class="tile-title">Join a team project</span><span class="tile-desc">Paste its GitHub link; it lands in My Projects.</span></span>
        </button>
        <button class="tile reg-hover" data-start="quick">
          <span class="tile-ic"><svg class="logo-ic" viewBox="0 0 256 384" aria-hidden="true"><use href="#b-figma-color"/></svg></span>
          <span class="tile-body"><span class="tile-title">One task on a live Figma file</span><span class="tile-desc">One component, an audit or one fix, no intake.</span></span>
        </button>
        <button class="tile reg-hover" data-start="chat">
          <span class="tile-ic"><svg class="ic brand-fill claude"><use href="#b-claude"/></svg></span>
          <span class="tile-body"><span class="tile-title">Ask Claude</span><span class="tile-desc">Any request, like in the terminal.</span></span>
        </button>
      </div>
    </section>

    <section class="board-wrap" aria-labelledby="recent" id="recent-wrap" hidden>
      <h2 id="recent" class="section-title">Recent conversations</h2>
      <ul id="recent-list" class="board"></ul>
    </section>

    <section class="insights-wrap" aria-labelledby="insights" id="insights-wrap" hidden>
      <h2 id="insights" class="section-title">Worth a look</h2>
      <div id="insight-list" class="insights"></div>
    </section>
  </main>
</template>

<template id="tpl-projects">
  <main class="home projects-page">
    <header class="page-head">
      <div>
        <h1>Projects</h1>
        <p class="lead">Every folder in My Projects. Open one to work on it with Claude; its files, Figma links and stage stay here.</p>
      </div>
      <div class="page-actions">
        <div class="seg" role="group" aria-label="View">
          <button type="button" data-view="cards" aria-pressed="true" title="Cards"><svg class="ic"><use href="#i-grid"/></svg><span>Cards</span></button>
          <button type="button" data-view="table" aria-pressed="false" title="Table"><svg class="ic"><use href="#i-list"/></svg><span>Table</span></button>
        </div>
        <button class="textbtn" type="button" id="refresh"><svg class="ic"><use href="#i-refresh"/></svg>Refresh</button>
        <button class="primary" type="button" id="add-project"><svg class="ic"><use href="#i-plus"/></svg>Add project</button>
      </div>
    </header>
    <div id="project-list" class="tickets"><p class="muted">Loading…</p></div>
  </main>
</template>

<template id="tpl-chat">
  <div class="chat-layout">
    <aside class="side" aria-label="Project">
      <a class="back" href="#/projects" id="back"><svg class="ic"><use href="#i-left"/></svg>All projects</a>
      <div class="side-head sheet">
        <div class="side-kicker" id="side-kicker">Conversation</div>
        <h2 id="side-title"></h2>
        <p class="note" id="side-meta"></p>
        <div id="side-track"></div>
      </div>
      <div id="side-links" class="side-links"></div>
      <button class="ghost inputs-btn" type="button" id="add-inputs" hidden><svg class="ic"><use href="#i-upload"/></svg>Add Inputs<small id="inputs-count"></small></button>
      <div id="side-actions" class="side-actions"></div>
      <div class="side-foot">
        <button class="ghost" type="button" id="to-tool" title="Hand this conversation to Codex, Gemini or Antigravity"><svg class="ic"><use href="#i-swap"/></svg>Continue with another tool</button>
        <button class="ghost" type="button" id="to-terminal" title="Continue this conversation in a terminal"><svg class="ic"><use href="#i-terminal"/></svg>Open in Claude Code</button>
      </div>
    </aside>
    <section class="chat" aria-label="Conversation">
      <div id="log" class="log" aria-live="polite"></div>
      <form id="composer" class="composer" autocomplete="off">
        <div id="attachments" class="attachments"></div>
        <div class="composer-row">
          <label class="attach" title="Attach an image">
            <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
            <svg class="ic" aria-hidden="true"><use href="#i-clip"/></svg><span class="sr">Attach an image</span>
          </label>
          <textarea id="input" rows="1" placeholder="Write to Claude (Arabic or English). Paste or drop screenshots here." dir="auto"></textarea>
          <button type="button" id="stop" class="ghost" hidden><svg class="ic"><use href="#i-stop"/></svg>Stop</button>
          <button type="submit" id="send" class="primary"><svg class="ic"><use href="#i-send"/></svg><span>Send</span></button>
        </div>
        <div class="composer-foot">
          <label class="model-pick" id="agent-wrap" hidden title="Who answers in this conversation. Switching keeps this window and its history; the other tool reads what happened first.">
            <svg class="ic" aria-hidden="true"><use href="#i-swap"/></svg>
            <select id="agent" aria-label="Tool"><option value="claude">Claude</option><option value="gemini">Gemini CLI</option></select>
          </label>
          <label class="model-pick" id="model-wrap" hidden title="The model for this conversation. New conversations start on the one you picked last.">
            <svg class="ic brand-fill claude" id="model-icon" aria-hidden="true"><use href="#b-claude"/></svg>
            <select id="model" aria-label="Model"></select>
          </label>
          <p class="note" id="status-line"></p>
        </div>
      </form>
    </section>
  </div>
</template>

<template id="tpl-dialog">
  <dialog class="ask" id="ask">
    <form method="dialog" class="ask-form">
      <h3 id="ask-title"></h3>
      <p class="muted" id="ask-help"></p>
      <textarea id="ask-input" rows="3" dir="auto"></textarea>
      <div class="ask-buttons">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="primary" id="ask-ok">Start</button>
      </div>
    </form>
  </dialog>
</template>

<template id="tpl-signin">
  <dialog class="ask signin" id="signin">
    <div class="ask-form">
      <h3>Sign in to Claude</h3>
      <p class="muted" id="signin-help">Uses the same account as Claude Code in the terminal. Your browser opens the Claude sign-in page; finish there and come back.</p>
      <div id="signin-body"></div>
      <div class="ask-buttons">
        <button type="button" class="ghost" id="signin-close">Close</button>
        <button type="button" class="primary" id="signin-start">Sign in</button>
      </div>
    </div>
  </dialog>
</template>

<template id="tpl-styles">
  <main class="home styles-page">
    <header class="page-head">
      <div>
        <h1>Style library</h1>
        <p class="lead">Looks a new project can start from: colors, type, radius and mood. The components keep the reference design system's structure; a style only changes how they look. Styles named after a company give the mood, never its logo, name or fonts.</p>
      </div>
      <p class="note" id="style-count"></p>
    </header>
    <div class="sl-tools">
      <label class="sl-search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="style-search" placeholder="Search styles, e.g. warm, dark, fintech" aria-label="Search styles" dir="auto"></label>
      <div class="sl-cats" id="style-cats" role="group" aria-label="Category"></div>
    </div>
    <div id="style-list" class="sl-grid"><p class="muted">Loading…</p></div>
  </main>
</template>

<template id="tpl-style">
  <dialog class="ask style-dlg" id="styledlg">
    <form method="dialog" class="ask-form">
      <h3 id="style-title"></h3>
      <div class="style-meta" id="style-meta"></div>
      <p class="note" id="style-brand-note" hidden>Inspired by a brand: the project takes its mood only. Its logo, product names, illustrations and fonts are never copied, and your own brand color wins.</p>
      <div class="style-body" id="style-body"></div>
      <div class="ask-buttons">
        <button value="cancel" class="ghost">Close</button>
        <button type="button" class="primary" id="style-use">Use for a new project</button>
      </div>
    </form>
  </dialog>
</template>

<template id="tpl-add">
  <dialog class="ask add" id="adddlg">
    <form method="dialog" class="ask-form" id="add-form">
      <h3 id="add-title"></h3>
      <div class="add-cols">
        <div><p class="col-title">What you need</p><ol id="add-need"></ol></div>
        <div><p class="col-title">What happens when you press Add</p><ol id="add-steps"></ol></div>
      </div>
      <div id="add-fields" class="add-fields"></div>
      <p class="note" id="add-note"></p>
      <div class="ask-buttons">
        <button value="cancel" class="ghost" formnovalidate>Cancel</button>
        <button value="ok" class="primary">Add</button>
      </div>
    </form>
  </dialog>
</template>

<template id="tpl-settings">
  <main class="settings">
    <header class="settings-head">
      <h1>Settings</h1>
      <p class="lead">The AI tools, accounts and services this workflow uses on this computer. Sign-ins happen in each tool's own window; nothing here stores a password or token.</p>
    </header>

    <section aria-labelledby="s-tools">
      <div class="row-head"><h2 id="s-tools" class="section-title">AI tools</h2><button class="textbtn" type="button" id="s-refresh"><svg class="ic"><use href="#i-refresh"/></svg>Check again</button></div>
      <p class="muted small">Claude Code runs inside this dashboard. The others open in their own window on the same folder, follow AGENTS.md and ask their own approvals.</p>
      <div id="s-tool-list" class="tool-grid"><p class="muted">Checking the tools on this computer…</p></div>
    </section>

    <section aria-labelledby="s-fallback" class="sheet setting-row">
      <div>
        <h2 id="s-fallback" class="row-title">When Claude hits its usage limit</h2>
        <p class="muted small">The conversation is written to a handoff note, and the tool you pick continues from the same step. When Claude is back, it audits what the other tool did first.</p>
      </div>
      <select id="s-fallback-pick" aria-labelledby="s-fallback">
        <option value="ask">Ask me each time</option>
        <option value="codex">Continue with Codex</option>
        <option value="gemini">Continue with Gemini CLI</option>
      </select>
    </section>

    <section aria-labelledby="s-usage">
      <h2 id="s-usage" class="section-title">Usage</h2>
      <p class="muted small">Tokens used through this dashboard, counted on this computer. Plans do not share how much is left, so a limit shows here when a tool reports one.</p>
      <div id="s-usage-body"><p class="muted">Loading…</p></div>
    </section>

    <div class="settings-cols">
      <section aria-labelledby="s-github" class="sheet panel">
        <h2 id="s-github" class="row-title"><svg class="ic brand-fill"><use href="#b-github"/></svg>GitHub</h2>
        <div id="s-github-body" class="kv"><p class="muted">Loading…</p></div>
      </section>
      <section aria-labelledby="s-figma" class="sheet panel">
        <h2 id="s-figma" class="row-title"><svg class="logo-ic" viewBox="0 0 256 384" aria-hidden="true"><use href="#b-figma-color"/></svg>Figma</h2>
        <div id="s-figma-body" class="kv"><p class="muted">Loading…</p></div>
      </section>
      <section aria-labelledby="s-prefs" class="sheet panel">
        <h2 id="s-prefs" class="row-title"><svg class="ic"><use href="#i-shield"/></svg>This computer</h2>
        <div id="s-prefs-body" class="kv"></div>
      </section>
    </div>
  </main>
</template>

<template id="tpl-project-form">
  <dialog class="ask" id="projdlg">
    <form method="dialog" class="ask-form">
      <h3 id="proj-title">Add a project</h3>
      <p class="muted" id="proj-help"></p>
      <label class="field"><span>Project name</span><input id="proj-name" type="text" required maxlength="80" autocomplete="off" dir="auto" placeholder="e.g. Clinic booking app"></label>
      <p class="note" id="proj-folder"></p>
      <label class="check" id="proj-start-row"><input type="checkbox" id="proj-start" checked><span>Start the intake now</span></label>
      <div class="ask-buttons">
        <button value="cancel" class="ghost" formnovalidate>Cancel</button>
        <button value="ok" class="primary" id="proj-ok">Add project</button>
      </div>
    </form>
  </dialog>
</template>

<template id="tpl-delete">
  <dialog class="ask danger-dlg" id="deldlg">
    <form method="dialog" class="ask-form">
      <h3>Delete <span id="del-name"></span>?</h3>
      <p class="muted">The project folder <code id="del-folder"></code> is removed from this computer: its brief, changelog, inputs, data, docs and Storybook. Figma files and GitHub repos are not touched.</p>
      <p class="note warn-line" id="del-team" hidden><svg class="ic"><use href="#i-alert"/></svg>This is a team project: anything you did not push yet is lost.</p>
      <label class="field"><span>Type <b>Delete</b> to confirm</span><input id="del-confirm" type="text" autocomplete="off" spellcheck="false" placeholder="Delete"></label>
      <div class="ask-buttons">
        <button value="cancel" class="ghost" formnovalidate>Cancel</button>
        <button value="ok" class="primary danger" id="del-ok" disabled><svg class="ic"><use href="#i-trash"/></svg>Delete project</button>
      </div>
    </form>
  </dialog>
</template>

<template id="tpl-inputs">
  <dialog class="ask inputs-dlg" id="inputsdlg">
    <form method="dialog" class="ask-form">
      <h3>Add Inputs</h3>
      <p class="muted">Files Claude reads before it decides colors, fonts and direction. They are copied into this project's <code>Inputs</code> folder.</p>
      <div class="tabs" role="tablist" id="inputs-tabs"></div>
      <div id="inputs-panel" role="tabpanel"></div>
      <div class="ask-buttons">
        <button value="cancel" class="ghost">Close</button>
        <button value="read" class="primary" id="inputs-read" hidden>Ask Claude to read them</button>
      </div>
    </form>
  </dialog>
</template>

<template id="tpl-toolpick">
  <dialog class="ask" id="toolpick">
    <form method="dialog" class="ask-form">
      <h3>Continue with another tool</h3>
      <p class="muted">This conversation is written to a handoff note, then the tool opens in its own window on the same folder and continues from there. Use it when Claude hits its limit, or to get a second opinion.</p>
      <div id="toolpick-list" class="pick-list"></div>
      <div class="ask-buttons"><button value="cancel" class="ghost">Cancel</button></div>
    </form>
  </dialog>
</template>

<template id="tpl-perm">
  <dialog class="ask" id="permdlg">
    <form method="dialog" class="ask-form">
      <h3>How often should Claude ask?</h3>
      <label class="opt"><input type="radio" name="mode" value="auto"><span><b>Auto (Recommended)</b><small>Claude approves routine steps by itself (reading, editing workflow files, Figma scripts, audits) and asks only before risky ones, like deleting files, pushing to GitHub or installing something. The same Auto mode as Claude Code.</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="default"><span><b>Ask every time</b><small>A Yes / No card before every step that needs permission.</small></span></label>
      <p class="note">Design questions and checkpoint approvals still come to you either way: they are your decisions, not permissions.</p>
      <div class="ask-buttons">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="primary">Save</button>
      </div>
    </form>
  </dialog>
</template>

<script src="style-library.js"></script>
<script src="app.js"></script>
</body>
</html>
